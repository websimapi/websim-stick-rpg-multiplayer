<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stick RPG - Multiplayer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #2c3e50;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        
        #gameCanvas {
            display: block;
            margin: 0 auto;
            background: #34495e;
            border: 2px solid #ecf0f1;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 14px;
            z-index: 100;
        }
        
        #chat {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 300px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
        }
        
        #chatInput {
            width: 100%;
            background: #1a1a1a;
            color: white;
            border: 1px solid #666;
            padding: 5px;
        }
        
        #chatMessages {
            height: 100px;
            overflow-y: auto;
            margin-bottom: 5px;
            font-size: 12px;
            color: #ccc;
        }
        
        .player-name {
            position: absolute;
            color: white;
            font-size: 12px;
            text-align: center;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }
        
        .health-bar {
            position: absolute;
            width: 40px;
            height: 4px;
            background: red;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border: 1px solid #333;
        }
        
        .health-fill {
            height: 100%;
            background: #00ff00;
            transition: width 0.2s;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="ui">
        <div>HP: <span id="playerHealth">100</span>/100</div>
        <div>Players Online: <span id="playerCount">0</span></div>
    </div>
    
    <div id="chat">
        <div id="chatMessages"></div>
        <input type="text" id="chatInput" placeholder="Press Enter to chat..." maxlength="50">
    </div>

    <script type="module">
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const TILE_SIZE = 32;
        const WORLD_WIDTH = 25;
        const WORLD_HEIGHT = 18;
        
        let camera = { x: 0, y: 0 };
        let keys = {};
        let lastShot = 0;
        
        // Initialize room
        const room = new WebsimSocket();
        await room.initialize();
        
        // Initialize game state
        const gameState = {
            players: {},
            projectiles: {},
            world: {
                obstacles: {
                    "tree-1": { x: 5, y: 5, type: "tree" },
                    "tree-2": { x: 15, y: 8, type: "tree" },
                    "tree-3": { x: 20, y: 12, type: "tree" },
                    "rock-1": { x: 8, y: 3, type: "rock" },
                    "rock-2": { x: 18, y: 15, type: "rock" },
                    "house-1": { x: 12, y: 6, type: "house" }
                }
            }
        };
        
        // Initialize room state
        room.updateRoomState({
            projectiles: {},
            world: gameState.world
        });
        
        // Initialize player presence
        room.updatePresence({
            x: Math.random() * WORLD_WIDTH * TILE_SIZE,
            y: Math.random() * WORLD_HEIGHT * TILE_SIZE,
            health: 100,
            maxHealth: 100,
            direction: 1,
            dead: false
        });
        
        // Subscribe to updates
        room.subscribePresence((presence) => {
            gameState.players = presence;
            updatePlayerCount();
        });
        
        room.subscribeRoomState((roomState) => {
            gameState.projectiles = roomState.projectiles || {};
            gameState.world = roomState.world || gameState.world;
        });
        
        // Handle damage requests
        room.subscribePresenceUpdateRequests((updateRequest, fromClientId) => {
            const player = room.presence[room.clientId];
            if (updateRequest.type === 'damage' && !player.dead) {
                const newHealth = Math.max(0, player.health - updateRequest.amount);
                room.updatePresence({
                    ...player,
                    health: newHealth,
                    dead: newHealth <= 0
                });
                
                if (newHealth <= 0) {
                    // Respawn after 3 seconds
                    setTimeout(() => {
                        room.updatePresence({
                            x: Math.random() * WORLD_WIDTH * TILE_SIZE,
                            y: Math.random() * WORLD_HEIGHT * TILE_SIZE,
                            health: 100,
                            maxHealth: 100,
                            direction: 1,
                            dead: false
                        });
                    }, 3000);
                }
            }
        });
        
        // Chat functionality
        const chatInput = document.getElementById('chatInput');
        const chatMessages = document.getElementById('chatMessages');
        
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && chatInput.value.trim()) {
                room.send({
                    type: 'chat',
                    message: chatInput.value.trim(),
                    username: room.peers[room.clientId].username
                });
                chatInput.value = '';
            }
        });
        
        room.onmessage = (event) => {
            if (event.data.type === 'chat') {
                const message = document.createElement('div');
                message.textContent = `${event.data.username}: ${event.data.message}`;
                chatMessages.appendChild(message);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        };
        
        // Game loop
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }
        
        function update() {
            const player = room.presence[room.clientId];
            if (!player || player.dead) return;
            
            let dx = 0;
            let dy = 0;
            
            if (keys['w'] || keys['ArrowUp']) dy -= 2;
            if (keys['s'] || keys['ArrowDown']) dy += 2;
            if (keys['a'] || keys['ArrowLeft']) { dx -= 2; room.updatePresence({ ...player, direction: -1 }); }
            if (keys['d'] || keys['ArrowRight']) { dx += 2; room.updatePresence({ ...player, direction: 1 }); }
            
            // Normalize diagonal movement
            if (dx !== 0 && dy !== 0) {
                dx *= 0.707;
                dy *= 0.707;
            }
            
            const newX = Math.max(0, Math.min(WORLD_WIDTH * TILE_SIZE - TILE_SIZE, player.x + dx));
            const newY = Math.max(0, Math.min(WORLD_HEIGHT * TILE_SIZE - TILE_SIZE, player.y + dy));
            
            // Check collision with obstacles
            if (!checkCollision(newX, newY)) {
                room.updatePresence({ ...player, x: newX, y: newY });
            }
            
            // Camera follow
            camera.x = player.x - canvas.width / 2;
            camera.y = player.y - canvas.height / 2;
            
            // Shooting
            if (keys[' '] && Date.now() - lastShot > 300) {
                shoot();
                lastShot = Date.now();
            }
            
            // Update projectiles
            const projectiles = room.roomState.projectiles || {};
            const updatedProjectiles = {};
            
            for (const [id, projectile] of Object.entries(projectiles)) {
                const newProjectile = updateProjectile(projectile);
                if (newProjectile) {
                    updatedProjectiles[id] = newProjectile;
                } else {
                    // Hit detection
                    for (const [clientId, target] of Object.entries(room.presence)) {
                        if (clientId !== projectile.owner && !target.dead) {
                            const dist = Math.hypot(
                                newProjectile ? newProjectile.x : projectile.x - target.x,
                                newProjectile ? newProjectile.y : projectile.y - target.y
                            );
                            if (dist < TILE_SIZE / 2) {
                                room.requestPresenceUpdate(clientId, {
                                    type: 'damage',
                                    amount: 20
                                });
                            }
                        }
                    }
                }
            }
            
            room.updateRoomState({
                projectiles: updatedProjectiles
            });
            
            // Update UI
            document.getElementById('playerHealth').textContent = player.health;
        }
        
        function checkCollision(x, y) {
            const playerRect = {
                x: x,
                y: y,
                width: TILE_SIZE,
                height: TILE_SIZE
            };
            
            for (const obstacle of Object.values(gameState.world.obstacles)) {
                const obstacleRect = {
                    x: obstacle.x * TILE_SIZE,
                    y: obstacle.y * TILE_SIZE,
                    width: TILE_SIZE,
                    height: TILE_SIZE
                };
                
                if (playerRect.x < obstacleRect.x + obstacleRect.width &&
                    playerRect.x + playerRect.width > obstacleRect.x &&
                    playerRect.y < obstacleRect.y + obstacleRect.height &&
                    playerRect.y + playerRect.height > obstacleRect.y) {
                    return true;
                }
            }
            return false;
        }
        
        function shoot() {
            const player = room.presence[room.clientId];
            const projectiles = room.roomState.projectiles || {};
            const id = Date.now().toString();
            
            projectiles[id] = {
                x: player.x + TILE_SIZE / 2,
                y: player.y + TILE_SIZE / 2,
                vx: player.direction * 5,
                vy: 0,
                owner: room.clientId
            };
            
            room.updateRoomState({ projectiles });
        }
        
        function updateProjectile(projectile) {
            const newX = projectile.x + projectile.vx;
            const newY = projectile.y + projectile.vy;
            
            // Check world bounds
            if (newX < 0 || newX > WORLD_WIDTH * TILE_SIZE ||
                newY < 0 || newY > WORLD_HEIGHT * TILE_SIZE) {
                return null;
            }
            
            // Check obstacle collision
            for (const obstacle of Object.values(gameState.world.obstacles)) {
                const obstacleRect = {
                    x: obstacle.x * TILE_SIZE,
                    y: obstacle.y * TILE_SIZE,
                    width: TILE_SIZE,
                    height: TILE_SIZE
                };
                
                if (newX > obstacleRect.x && newX < obstacleRect.x + obstacleRect.width &&
                    newY > obstacleRect.y && newY < obstacleRect.y + obstacleRect.height) {
                    return null;
                }
            }
            
            return { ...projectile, x: newX, y: newY };
        }
        
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Save context for camera transform
            ctx.save();
            ctx.translate(-camera.x, -camera.y);
            
            // Render world
            renderWorld();
            
            // Render players
            for (const [clientId, player] of Object.entries(gameState.players)) {
                if (!player.dead) {
                    renderPlayer(player, clientId);
                }
            }
            
            // Render projectiles
            for (const projectile of Object.values(gameState.projectiles)) {
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(projectile.x - 2, projectile.y - 2, 4, 4);
            }
            
            ctx.restore();
        }
        
        function renderWorld() {
            // Ground
            ctx.fillStyle = '#2d5a27';
            ctx.fillRect(0, 0, WORLD_WIDTH * TILE_SIZE, WORLD_HEIGHT * TILE_SIZE);
            
            // Grid lines
            ctx.strokeStyle = '#1a3c17';
            ctx.lineWidth = 1;
            for (let x = 0; x <= WORLD_WIDTH; x++) {
                ctx.beginPath();
                ctx.moveTo(x * TILE_SIZE, 0);
                ctx.lineTo(x * TILE_SIZE, WORLD_HEIGHT * TILE_SIZE);
                ctx.stroke();
            }
            for (let y = 0; y <= WORLD_HEIGHT; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * TILE_SIZE);
                ctx.lineTo(WORLD_WIDTH * TILE_SIZE, y * TILE_SIZE);
                ctx.stroke();
            }
            
            // Obstacles
            for (const [id, obstacle] of Object.entries(gameState.world.obstacles)) {
                const x = obstacle.x * TILE_SIZE;
                const y = obstacle.y * TILE_SIZE;
                
                switch (obstacle.type) {
                    case 'tree':
                        ctx.fillStyle = '#0f5132';
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = '#198754';
                        ctx.fillRect(x + 4, y + 4, TILE_SIZE - 8, TILE_SIZE - 8);
                        break;
                    case 'rock':
                        ctx.fillStyle = '#6c757d';
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = '#8a8a8a';
                        ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                        break;
                    case 'house':
                        ctx.fillStyle = '#8b4513';
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = '#a0522d';
                        ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                        ctx.fillStyle = '#654321';
                        ctx.fillRect(x + 8, y + 16, 8, 12);
                        break;
                }
            }
        }
        
        function renderPlayer(player, clientId) {
            const x = player.x;
            const y = player.y;
            
            // Body
            ctx.fillStyle = '#8b4513';
            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
            
            // Head
            ctx.fillStyle = '#deb887';
            ctx.fillRect(x + 8, y + 4, 16, 12);
            
            // Eyes
            ctx.fillStyle = '#000';
            if (player.direction > 0) {
                ctx.fillRect(x + 18, y + 6, 2, 2);
            } else {
                ctx.fillRect(x + 12, y + 6, 2, 2);
            }
            
            // Arms
            ctx.strokeStyle = '#deb887';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x + 8, y + 20);
            ctx.lineTo(x, y + 22);
            ctx.moveTo(x + 24, y + 20);
            ctx.lineTo(x + 32, y + 22);
            ctx.stroke();
            
            // Legs
            ctx.beginPath();
            ctx.moveTo(x + 8, y + 28);
            ctx.lineTo(x + 4, y + 32);
            ctx.moveTo(x + 24, y + 28);
            ctx.lineTo(x + 28, y + 32);
            ctx.stroke();
            
            // Player name and health
            const nameElement = document.createElement('div');
            nameElement.className = 'player-name';
            nameElement.style.left = (x - camera.x + TILE_SIZE / 2) + 'px';
            nameElement.style.top = (y - camera.y - 10) + 'px';
            nameElement.textContent = room.peers[clientId].username;
            
            const healthBar = document.createElement('div');
            healthBar.className = 'health-bar';
            healthBar.style.left = (x - camera.x + TILE_SIZE / 2 - 20) + 'px';
            healthBar.style.top = (y - camera.y + TILE_SIZE + 5) + 'px';
            
            const healthFill = document.createElement('div');
            healthFill.className = 'health-fill';
            healthFill.style.width = (player.health / player.maxHealth * 100) + '%';
            healthBar.appendChild(healthFill);
            
            const ui = document.getElementById('ui');
            if (!ui.querySelector(`[data-client="${clientId}"]`)) {
                nameElement.setAttribute('data-client', clientId);
                healthBar.setAttribute('data-client', clientId);
                document.body.appendChild(nameElement);
                document.body.appendChild(healthBar);
            } else {
                const oldName = document.querySelector(`[data-client="${clientId}"].player-name`);
                const oldHealth = document.querySelector(`[data-client="${clientId}"].health-bar`);
                if (oldName) {
                    oldName.style.left = nameElement.style.left;
                    oldName.style.top = nameElement.style.top;
                    oldHealth.style.left = healthBar.style.left;
                    oldHealth.style.top = healthBar.style.top;
                    oldHealth.querySelector('.health-fill').style.width = healthFill.style.width;
                }
            }
        }
        
        function updatePlayerCount() {
            document.getElementById('playerCount').textContent = Object.keys(gameState.players).length;
        }
        
        // Input handling
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // Prevent context menu
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());
        
        // Start game
        gameLoop();
    </script>
